nfr_validation:
  security:
    status: PASS
    notes: "Authorization properly enforced (owner-only rating). 404 returned for unauthorized access to prevent enumeration. Authentication required via JwtAuthGuard."
  performance:
    status: PASS
    notes: "Simple database update with no complex queries. Filtering by minRating uses database index on rating column."
  reliability:
    status: PASS
    notes: "Comprehensive error handling with proper HTTP status codes (400, 401, 403, 404). Validation ensures data integrity."
  maintainability:
    status: PASS
    notes: "Clean separation of concerns (Controller->Service->Repository). Follows existing codebase patterns. Self-documenting code with clear naming."

requirements_traceability:
  - ac: 1
    requirement: "PUT /api/recipes/:id/rating endpoint accepts {rating: 1-5}"
    tests:
      - test: "should update recipe rating to 5"
        scenario: "Given authenticated user owns recipe, When PUT with rating=5, Then rating updates to 5"
      - test: "should update recipe rating to 1"
        scenario: "Given authenticated user owns recipe, When PUT with rating=1, Then rating updates to 1"
      - test: "should update recipe rating to 3"
        scenario: "Given authenticated user owns recipe, When PUT with rating=3, Then rating updates to 3"
    coverage: COMPLETE

  - ac: 2
    requirement: "Rating stored in recipes table (rating column, nullable, default null)"
    tests:
      - test: "should update recipe rating to 5"
        scenario: "Given rating update succeeds, When checking database, Then rating column contains new value"
      - test: "should clear recipe rating (set to null)"
        scenario: "Given rating was set, When PUT with rating=null, Then database rating column is null"
    coverage: COMPLETE

  - ac: 3
    requirement: "Rating validation: integer between 1 and 5, or null to remove rating"
    tests:
      - test: "should return 400 for rating below 1"
        scenario: "Given authenticated user, When PUT with rating=0, Then returns 400 Bad Request"
      - test: "should return 400 for rating above 5"
        scenario: "Given authenticated user, When PUT with rating=6, Then returns 400 Bad Request"
      - test: "should return 400 for non-integer rating"
        scenario: "Given authenticated user, When PUT with rating=3.5, Then returns 400 Bad Request"
      - test: "should clear recipe rating (set to null)"
        scenario: "Given authenticated user, When PUT with rating=null, Then rating cleared successfully"
    coverage: COMPLETE

  - ac: 4
    requirement: "Only recipe owner can rate their own recipes"
    tests:
      - test: "should return 403 when trying to rate another user's recipe"
        scenario: "Given authenticated user does not own recipe, When PUT rating, Then returns 403 Forbidden"
      - test: "should return 401 when not authenticated"
        scenario: "Given no authentication token, When PUT rating, Then returns 401 Unauthorized"
    coverage: COMPLETE

  - ac: 5
    requirement: "Recipe list API includes rating field for filtering/sorting"
    tests:
      - test: "All minRating filter tests verify rating field in response"
        scenario: "Given recipes with ratings exist, When GET /api/recipes, Then rating field included in response"
    coverage: COMPLETE
    notes: "Rating already added to RecipeListItemDto in Story 2.8, confirmed present"

  - ac: 6
    requirement: "GET /api/recipes?minRating=4 filters recipes with rating >= 4"
    tests:
      - test: "should filter recipes with minRating=4 (returns 4 and 5 star recipes)"
        scenario: "Given recipes with various ratings exist, When GET with minRating=4, Then only recipes with rating >= 4 returned"
      - test: "should filter recipes with minRating=5 (returns only 5 star recipes)"
        scenario: "Given recipes with various ratings exist, When GET with minRating=5, Then only 5-star recipes returned"
      - test: "should filter recipes with minRating=1 (returns all rated recipes)"
        scenario: "Given recipes with various ratings exist, When GET with minRating=1, Then all rated recipes returned"
      - test: "should return 400 for invalid minRating (below 1)"
        scenario: "Given invalid filter, When GET with minRating=0, Then returns 400 Bad Request"
      - test: "should return 400 for invalid minRating (above 5)"
        scenario: "Given invalid filter, When GET with minRating=6, Then returns 400 Bad Request"
    coverage: COMPLETE

  - ac: 7
    requirement: "Star rating UI component displays half-stars for future decimal ratings"
    tests: []
    coverage: NOT_APPLICABLE
    notes: "Frontend UI component - out of scope for backend API story. Should be tested in frontend story."

