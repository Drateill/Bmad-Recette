# Security fix details
security_fixes:
  - issue: "Authorization returns 403 instead of 404 (information disclosure)"
    severity: high
    owasp_category: "A01:2021 – Broken Access Control"
    fixed: true
    files_modified:
      - "apps/api/src/modules/recipes/recipes.service.ts"
      - "apps/api/src/modules/recipes/recipes.controller.ts"
      - "apps/api/test/recipes/get-recipe.service.spec.ts"
      - "apps/api/test/recipes/get-recipe.e2e.spec.ts"
    fix_description: |
      Combined authorization check with existence check to return 404 for both cases.
      This prevents attackers from enumerating valid recipe IDs by distinguishing
      between "recipe not found" and "unauthorized access".
    tests_updated: true
    all_tests_passing: true

